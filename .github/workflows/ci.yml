name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # ODBC step of examples/demo: Postgres in Podman (preinstalled) + psqlODBC.
      - run: sudo apt-get update && sudo apt-get install -y unixodbc odbc-postgresql
      - run: just e2e
