<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-label="Duct">
  <title>Duct</title>
  <!-- stem: straight steel pipe -->
  <rect x="9" y="7" width="13" height="50" rx="1.5" fill="#2B3440"/>
  <!-- bowl: elbow pipe forming the D -->
  <path d="M22 13.5 H31 A18.5 18.5 0 0 1 31 50.5 H22" fill="none" stroke="#F26B1D" stroke-width="13" stroke-linecap="butt"/>
  <!-- flanges joining stem and elbow -->
  <rect x="21" y="4" width="5" height="19" rx="1" fill="#161B22"/>
  <rect x="21" y="41" width="5" height="19" rx="1" fill="#161B22"/>
  <!-- bolts -->
  <circle cx="23.5" cy="7.5" r="1.2" fill="#8A96A3"/>
  <circle cx="23.5" cy="19.5" r="1.2" fill="#8A96A3"/>
  <circle cx="23.5" cy="44.5" r="1.2" fill="#8A96A3"/>
  <circle cx="23.5" cy="56.5" r="1.2" fill="#8A96A3"/>
</svg>
